name: Carmel Connect exact-commit release

on:
  issues:
    types: [labeled]
  pull_request:
    branches: [main]
    paths:
      - .bridge/**
      - .github/**
      - README.md
      - .gitignore

concurrency:
  group: carmel-connect-all-releases
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  controller-check:
    name: Verify deployment controller
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout proposed controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline controller safety tests
        run: python3 -I -m unittest discover -s .bridge -p 'test_*.py' -v

  validate:
    name: Validate trusted release request
    if: >-
      github.event_name == 'issues' &&
      github.repository == 'Samantha1294/Carmel-connect-deployer' &&
      github.actor == 'Samantha1294' &&
      github.event.issue.user.login == 'Samantha1294' &&
      (github.event.label.name == 'deploy-dev-approved' ||
       github.event.label.name == 'deploy-production-approved')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      target: ${{ steps.request.outputs.target }}
      source_sha: ${{ steps.request.outputs.source_sha }}
    steps:
      - name: Checkout protected controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline controller safety tests
        run: python3 -I -m unittest discover -s .bridge -p 'test_*.py' -v
      - name: Validate labeled issue request
        id: request
        run: python3 -I .bridge/controller.py validate

  candidate-test-dev:
    name: Test exact DEV candidate
    needs: validate
    if: needs.validate.outputs.target == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: carmel-dev
    steps:
      - name: Checkout protected controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch and verify exact private source
        env:
          SOURCE_TOKEN: ${{ secrets.CARMEL_SOURCE_TOKEN }}
        run: python3 -I .bridge/controller.py fetch
      - name: Candidate static tests without deployment credentials
        run: |
          if node --test \
            candidate/tests/academic-policy.cjs \
            candidate/tests/academic-profile-integration.cjs \
            candidate/tests/academic-standing-ui.cjs \
            candidate/tests/security-authorization.cjs \
            candidate/tests/security-hardening.cjs \
            candidate/tests/student-college-plans.cjs \
            >/tmp/candidate-test.log 2>&1; then
            echo "Candidate static tests passed."
          else
            echo "STOP: Candidate static tests failed; output suppressed in this public controller."
            exit 1
          fi

  dev:
    name: Deploy DEV
    needs: [validate, candidate-test-dev]
    if: needs.validate.outputs.target == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: carmel-dev
    steps:
      - name: Checkout protected controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch and verify exact private source
        env:
          SOURCE_TOKEN: ${{ secrets.CARMEL_SOURCE_TOKEN }}
        run: python3 -I .bridge/controller.py fetch
      - name: Verified DEV release ${{ needs.validate.outputs.source_sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTOR_TOKEN: ${{ secrets.CARMEL_EXECUTOR_TOKEN }}
          GITHUB_EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 -I .bridge/controller.py dispatch

  candidate-test-production:
    name: Test exact production candidate
    needs: validate
    if: needs.validate.outputs.target == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: carmel-production
    steps:
      - name: Checkout protected controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch and verify exact private source
        env:
          SOURCE_TOKEN: ${{ secrets.CARMEL_SOURCE_TOKEN }}
        run: python3 -I .bridge/controller.py fetch
      - name: Candidate static tests without deployment credentials
        run: |
          if node --test \
            candidate/tests/academic-policy.cjs \
            candidate/tests/academic-profile-integration.cjs \
            candidate/tests/academic-standing-ui.cjs \
            candidate/tests/security-authorization.cjs \
            candidate/tests/security-hardening.cjs \
            candidate/tests/student-college-plans.cjs \
            >/tmp/candidate-test.log 2>&1; then
            echo "Candidate static tests passed."
          else
            echo "STOP: Candidate static tests failed; output suppressed in this public controller."
            exit 1
          fi

  production:
    name: Deploy production
    needs: [validate, candidate-test-production]
    if: needs.validate.outputs.target == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: carmel-production
    steps:
      - name: Checkout protected controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch and verify exact private source
        env:
          SOURCE_TOKEN: ${{ secrets.CARMEL_SOURCE_TOKEN }}
        run: python3 -I .bridge/controller.py fetch
      - name: Verified production release
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTOR_TOKEN: ${{ secrets.CARMEL_EXECUTOR_TOKEN }}
          GITHUB_EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 -I .bridge/controller.py dispatch
